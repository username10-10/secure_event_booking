{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Two-Factor Authentication" %} | Secure Event Booking{% endblock %}

{% block content %}
  <div class="card" style="max-width: 560px; margin: 40px auto;">
    {% block two_factor_content %}{% endblock %}
  </div>

  <style>
    /* Make default two_factor forms match your UI */
    .card h1, .card h2, .card h3 {
      margin-top: 0;
    }

    form input[type="text"],
    form input[type="password"],
    form input[type="number"],
    form input[type="email"],
    form select {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      margin-top: 6px;
      margin-bottom: 14px;
      font-size: 14px;
      box-sizing: border-box;
    }

    form button,
    input[type="submit"] {
      padding: 10px 14px;
      border-radius: 5px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    form button:hover,
    input[type="submit"]:hover {
      background: #1e40af;
    }

    /* Links */
    .card a {
      color: #2563eb;
      text-decoration: none;
    }
    .card a:hover {
      text-decoration: underline;
    }

    /* Reduce spacing for small screens */
    @media (max-width: 640px) {
      .card {
        margin: 20px 10px;
      }
    }
  </style>
{% endblock %}
